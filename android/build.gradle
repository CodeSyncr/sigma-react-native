buildscript {
  ext.getExtOrDefault = { name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["Sigma_" + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.5.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["Sigma_" + name]).toInteger()
}

android {
  namespace "com.codesyncr.sigma.reactnative"
  compileSdkVersion Math.max(35, getExtOrIntegerDefault("compileSdkVersion"))

  defaultConfig {
    // The native SDK (com.github.CodeSyncr:sigma-android) needs 26.
    minSdkVersion Math.max(26, getExtOrIntegerDefault("minSdkVersion"))
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  google()
  mavenCentral()
  // com.github.CodeSyncr:sigma-android is published through JitPack.
  maven { url "https://jitpack.io" }
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // Version resolved by the React Native Gradle Plugin.
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
  implementation "com.github.CodeSyncr:sigma-android:${getExtOrDefault('sigmaAndroidVersion')}"
}
